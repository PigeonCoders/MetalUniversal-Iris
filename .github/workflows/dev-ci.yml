# AI-monitorable dev CI. Triggers on workflow_dispatch, any feat/* or feature/*
# push, and pull requests targeting the active default branch.
# Monitor with:
#   gh run watch --repo PigeonCoders/MetalUniversal-Iris
#   gh run list --workflow=dev-ci.yml --repo PigeonCoders/MetalUniversal-Iris

name: dev-ci
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/iris-26.2-msl-pipeline'
      - 'feat/*'
      - 'feature/*'
      - 'iris-26.2-preview'
  pull_request:
    branches:
      - 'iris-26.2-preview'
      - 'master'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: select latest Xcode
        run: |
          echo "xcode-select current path: $(xcode-select -p)"
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "${LATEST_XCODE}" ]; then
            echo "Selecting latest Xcode: ${LATEST_XCODE}"
            sudo xcode-select -s "${LATEST_XCODE}"
          fi
          echo "xcode-select new path: $(xcode-select -p)"
          echo "swiftc version: $(xcrun -f swiftc)"
          echo "SDK path: $(xcrun --show-sdk-path)"
      - name: verify cmake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          cmake --version
      - name: build
        run: ./gradlew buildMacNative buildMacSpvc buildMacGlslang build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metallum-dev
          path: build/libs/
      - name: capture native libraries
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-dev
          path: src/main/resources/natives/
