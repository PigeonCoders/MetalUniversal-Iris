# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.16-SNAPSHOT
sodium_version=mc26.2-0.9.1-fabric
# Iris 26.2 (1.11.2) depends on sodium 0.9.1+mc26.2; the version below is the
# version_number published on Modrinth's maven (api.modrinth.com/maven) for
# the iris project slug. Note: Iris's build.gradle.kts createVersionString
# produces "<MOD_VERSION>+mc<MINECRAFT_VERSION>" for the JAR filename, but
# Modrinth publishes the maven artifact under a different version_number
# ("<MOD_VERSION>+<MC>-fabric"). Use the Modrinth version_number here.
iris_version=1.11.2+26.2-fabric

# Mod Properties
mod_version=1.0.5
maven_group=com.metallum